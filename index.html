<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MB-App · Movie Ticket Booking</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root {
    --bg: #0b1020;
    --surface: #151b2e;
    --surface-2: #1c2338;
    --accent: #ff4d6d;
    --accent-2: #c9184a;
    --selected: #22c55e;
    --occupied: #2a3145;
    --text: #f1f5ff;
    --muted: #8b97b8;
    --radius: 16px;
    --transition: 0.25s cubic-bezier(0.2, 0, 0, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }

  body {
    background: radial-gradient(circle at 20% 0%, #1a2444 0%, #0b1020 60%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .app {
    width: 100%;
    max-width: 1080px;
    background: rgba(21, 27, 46, 0.85);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 28px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.8);
    overflow: hidden;
    display: grid;
    grid-template-columns: 1fr;
    transition: var(--transition);
  }

  @media (min-width: 860px) {
    .app { grid-template-columns: 340px 1fr; }
  }

  /* ---------- SIDEBAR ---------- */
  .sidebar {
    padding: 28px 24px;
    background: rgba(0,0,0,0.25);
    border-bottom: 1px solid rgba(255,255,255,0.05);
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  @media (min-width: 860px) {
    .sidebar { border-right: 1px solid rgba(255,255,255,0.05); border-bottom: none; }
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 1.4rem;
    font-weight: 800;
    letter-spacing: -0.5px;
  }

  .brand i {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    width: 42px; height: 42px;
    border-radius: 14px;
    display: grid; place-items: center;
    color: white;
    font-size: 1.1rem;
    box-shadow: 0 8px 20px -6px var(--accent-2);
  }

  .brand span { color: var(--accent); }

  .field { display: flex; flex-direction: column; gap: 8px; }

  .field label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--muted);
    font-weight: 600;
  }

  .field select {
    appearance: none;
    background: var(--surface-2) url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238b97b8' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e") no-repeat right 14px center / 16px;
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 12px 40px 12px 14px;
    border-radius: 10px;
    font-size: 0.92rem;
    cursor: pointer;
    transition: var(--transition);
  }

  .field select:hover,
  .field select:focus { border-color: var(--accent); outline: none; }

  /* Movie chips */
  .movie-chips {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .movie-chips::-webkit-scrollbar { display: none; }

  .chip {
    flex: 0 0 auto;
    padding: 8px 14px;
    border-radius: 999px;
    background: var(--surface-2);
    border: 1px solid rgba(255,255,255,0.06);
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    transition: var(--transition);
    white-space: nowrap;
  }

  .chip:hover { color: var(--text); transform: translateY(-1px); }
  .chip.active {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: white;
    border-color: transparent;
    box-shadow: 0 8px 18px -8px var(--accent-2);
  }

  /* Summary */
  .summary {
    margin-top: auto;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px;
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .summary-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.88rem;
    color: var(--muted);
  }

  .summary-row strong {
    color: var(--text);
    font-weight: 600;
    text-align: right;
    max-width: 60%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .summary-row.total {
    padding-top: 12px;
    border-top: 1px dashed rgba(255,255,255,0.1);
    font-size: 1rem;
    color: var(--text);
  }

  .summary-row.total strong {
    color: var(--accent);
    font-size: 1.15rem;
  }

  .btn-book {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: white;
    border: none;
    padding: 14px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 0.98rem;
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    box-shadow: 0 12px 24px -10px var(--accent-2);
  }

  .btn-book:hover:not(:disabled) { transform: translateY(-2px); }
  .btn-book:active:not(:disabled) { transform: scale(0.98); }
  .btn-book:disabled {
    background: var(--surface-2);
    color: var(--muted);
    cursor: not-allowed;
    box-shadow: none;
  }

  /* ---------- SEAT AREA ---------- */
  .seat-area {
    padding: 34px 26px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
  }

  .screen-wrap {
    width: 100%;
    max-width: 340px;
    perspective: 500px;
  }

  .screen {
    height: 10px;
    background: linear-gradient(to bottom, #ffffff, rgba(255,255,255,0.05));
    border-radius: 6px;
    transform: rotateX(-35deg);
    box-shadow: 0 18px 34px -6px rgba(255,77,109,0.45);
  }

  .screen-label {
    text-align: center;
    margin-top: 14px;
    font-size: 0.7rem;
    letter-spacing: 5px;
    color: var(--muted);
    font-weight: 600;
  }

  /* Seats */
  .seats {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .seat-row {
    display: flex;
    gap: 7px;
    align-items: center;
    justify-content: center;
  }

  .row-label {
    width: 18px;
    font-size: 0.72rem;
    color: var(--muted);
    font-weight: 700;
    text-align: center;
  }

  .seat {
    width: 26px;
    height: 24px;
    background: var(--surface-2);
    border: 1px solid rgba(255,255,255,0.08);
    border-top-left-radius: 7px;
    border-top-right-radius: 7px;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
    position: relative;
  }

  .seat:not(.occupied):hover {
    transform: translateY(-3px) scale(1.1);
    border-color: var(--accent);
    box-shadow: 0 6px 14px -4px var(--accent);
  }

  .seat.selected {
    background: var(--selected);
    border-color: var(--selected);
    box-shadow: 0 0 14px rgba(34,197,94,0.6);
    animation: pop 0.28s ease;
  }

  @keyframes pop {
    0% { transform: scale(0.85); }
    60% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }

  .seat.occupied {
    background: var(--occupied);
    border-color: transparent;
    opacity: 0.45;
    cursor: not-allowed;
  }

  /* Aisle gaps */
  .seat.gap-right { margin-right: 14px; }

  /* Legend */
  .legend {
    display: flex;
    gap: 20px;
    list-style: none;
    flex-wrap: wrap;
    justify-content: center;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.78rem;
    color: var(--muted);
  }

  .legend-box {
    width: 16px;
    height: 15px;
    border-top-left-radius: 5px;
    border-top-right-radius: 5px;
  }

  /* Toast */
  .toast {
    position: fixed;
    left: 50%;
    bottom: -100px;
    transform: translateX(-50%);
    background: linear-gradient(135deg, var(--selected), #16a34a);
    color: #06210f;
    padding: 12px 26px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 0.9rem;
    box-shadow: 0 14px 30px -10px rgba(34,197,94,0.7);
    transition: bottom 0.35s cubic-bezier(0.2, 0, 0, 1);
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .toast.show { bottom: 30px; }

  /* Mobile tweaks */
  @media (max-width: 480px) {
    .seat { width: 22px; height: 21px; border-radius: 6px; }
    .seat-row { gap: 5px; }
    .seat.gap-right { margin-right: 10px; }
    .seat-area { padding: 22px 14px; }
    .sidebar { padding: 22px 18px; }
    .brand { font-size: 1.2rem; }
    .brand i { width: 36px; height: 36px; border-radius: 12px; }
  }
</style>
</head>
<body>

<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand">
      <i class="fas fa-film"></i>
      <div>MB<span>-App</span></div>
    </div>

    <div class="field">
      <label>Now Showing</label>
      <div class="movie-chips" id="movieChips">
        <button class="chip active" data-price="12" data-title="Interstellar">Interstellar · $12</button>
        <button class="chip" data-price="15" data-title="Dune: Part Two">Dune · $15</button>
        <button class="chip" data-price="10" data-title="Oppenheimer">Oppenheimer · $10</button>
        <button class="chip" data-price="14" data-title="Spider-Man">Spider-Man · $14</button>
      </div>
    </div>

    <div class="field">
      <label for="time">Showtime</label>
      <select id="time">
        <option value="14:00">02:00 PM</option>
        <option value="17:30" selected>05:30 PM</option>
        <option value="20:00">08:00 PM</option>
        <option value="22:30">10:30 PM</option>
      </select>
    </div>

    <div class="summary">
      <div class="summary-row">
        <span>Movie</span>
        <strong id="sumMovie">Interstellar</strong>
      </div>
      <div class="summary-row">
        <span>Seats</span>
        <strong id="sumSeats">—</strong>
      </div>
      <div class="summary-row">
        <span>Count</span>
        <strong id="sumCount">0</strong>
      </div>
      <div class="summary-row total">
        <span>Total</span>
        <strong>$<span id="sumTotal">0</span></strong>
      </div>
    </div>

    <button class="btn-book" id="bookBtn" disabled>
      <i class="fas fa-ticket-alt"></i> Confirm Booking
    </button>
  </aside>

  <!-- SEAT AREA -->
  <section class="seat-area">
    <div class="screen-wrap">
      <div class="screen"></div>
      <div class="screen-label">SCREEN</div>
    </div>

    <div class="seats" id="seats"></div>

    <ul class="legend">
      <li class="legend-item"><div class="legend-box" style="background:var(--surface-2);border:1px solid rgba(255,255,255,0.15)"></div>Available</li>
      <li class="legend-item"><div class="legend-box" style="background:var(--selected)"></div>Selected</li>
      <li class="legend-item"><div class="legend-box" style="background:var(--occupied);opacity:.5"></div>Occupied</li>
    </ul>
  </section>
</div>

<div class="toast" id="toast"><i class="fas fa-check-circle"></i> <span id="toastText">Booking Confirmed!</span></div>

<script>
(() => {
  // ---------- CONFIG ----------
  const ROWS = 6;
  const COLS = 10;
  const AISLE_AFTER = [3, 7]; // gap after columns 3 and 7
  const OCCUPIED = new Set(['A2','A3','B5','C6','C7','D1','E4','E5','F9']);
  const SEAT_PRICE_DEFAULT = 12;

  // ---------- STATE ----------
  let price = SEAT_PRICE_DEFAULT;
  let movieTitle = 'Interstellar';
  const selected = new Set();

  // ---------- DOM ----------
  const seatsEl      = document.getElementById('seats');
  const chipsEl      = document.querySelectorAll('.chip');
  const sumMovieEl   = document.getElementById('sumMovie');
  const sumSeatsEl   = document.getElementById('sumSeats');
  const sumCountEl   = document.getElementById('sumCount');
  const sumTotalEl   = document.getElementById('sumTotal');
  const bookBtn      = document.getElementById('bookBtn');
  const toast        = document.getElementById('toast');
  const toastText    = document.getElementById('toastText');

  // ---------- RENDER SEATS ----------
  function buildSeats() {
    seatsEl.innerHTML = '';
    for (let r = 0; r < ROWS; r++) {
      const rowLetter = String.fromCharCode(65 + r);
      const rowDiv = document.createElement('div');
      rowDiv.className = 'seat-row';

      const label = document.createElement('span');
      label.className = 'row-label';
      label.textContent = rowLetter;
      rowDiv.appendChild(label);

      for (let c = 1; c <= COLS; c++) {
        const seatId = `${rowLetter}${c}`;
        const seat = document.createElement('div');
        seat.className = 'seat';
        seat.dataset.id = seatId;
        seat.setAttribute('role', 'button');
        seat.setAttribute('aria-label', `Seat ${seatId}`);

        if (OCCUPIED.has(seatId)) seat.classList.add('occupied');
        if (AISLE_AFTER.includes(c)) seat.classList.add('gap-right');

        rowDiv.appendChild(seat);
      }
      seatsEl.appendChild(rowDiv);
    }
  }

  // ---------- UPDATE UI ----------
  function updateUI() {
    const ids = [...selected].sort();
    const count = ids.length;
    const total = count * price;

    sumMovieEl.textContent = movieTitle;
    sumSeatsEl.textContent = count ? ids.join(', ') : '—';
    sumCountEl.textContent = count;
    sumTotalEl.textContent = total;
    bookBtn.disabled = count === 0;

    // sync visual state
    document.querySelectorAll('.seat').forEach(s => {
      s.classList.toggle('selected', selected.has(s.dataset.id) && !s.classList.contains('occupied'));
    });
  }

  // ---------- SEAT CLICK ----------
  seatsEl.addEventListener('click', (e) => {
    const seat = e.target.closest('.seat');
    if (!seat || seat.classList.contains('occupied')) return;

    const id = seat.dataset.id;
    if (selected.has(id)) {
      selected.delete(id);
    } else {
      selected.add(id);
    }
    updateUI();
  });

  // ---------- MOVIE CHIPS ----------
  chipsEl.forEach(chip => {
    chip.addEventListener('click', () => {
      chipsEl.forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      price = +chip.dataset.price;
      movieTitle = chip.dataset.title;
      updateUI();
    });
  });

  // ---------- BOOK ----------
  bookBtn.addEventListener('click', () => {
    if (selected.size === 0) return;

    const bookedIds = [...selected].sort();
    const totalPaid = (bookedIds.length * price).toFixed(2);

    // Mark as permanently occupied
    bookedIds.forEach(id => {
      OCCUPIED.add(id);
      const seatEl = document.querySelector(`.seat[data-id="${id}"]`);
      if (seatEl) {
        seatEl.classList.remove('selected');
        seatEl.classList.add('occupied');
      }
    });

    selected.clear();
    updateUI();

    showToast(`Booked ${bookedIds.length} seat(s) for $${totalPaid} 🍿`);
  });

  // ---------- TOAST ----------
  let toastTimer;
  function showToast(msg) {
    toastText.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 3200);
  }

  // ---------- INIT ----------
  buildSeats();
  updateUI();
})();
</script>
</body>
</html>
