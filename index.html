<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MB-App · Movie Ticket Booking</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root {
    --bg: #0b1020;
    --surface: #151b2e;
    --surface-2: #1c2338;
    --accent: #ff4d6d;
    --accent-2: #c9184a;
    --selected: #22c55e;
    --occupied: #2a3145;
    --text: #f1f5ff;
    --muted: #8b97b8;
    --transition: 0.25s cubic-bezier(0.2, 0, 0, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }

  body {
    background: radial-gradient(circle at 20% 0%, #1a2444 0%, #0b1020 60%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .app {
    width: 100%;
    max-width: 1120px;
    background: rgba(21, 27, 46, 0.85);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 28px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.8);
    overflow: hidden;
    display: grid;
    grid-template-columns: 1fr;
    transition: var(--transition);
  }

  @media (min-width: 900px) {
    .app { grid-template-columns: 360px 1fr; }
  }

  /* ---------- SIDEBAR ---------- */
  .sidebar {
    padding: 26px 22px;
    background: rgba(0,0,0,0.28);
    border-bottom: 1px solid rgba(255,255,255,0.05);
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  @media (min-width: 900px) {
    .sidebar { border-right: 1px solid rgba(255,255,255,0.05); border-bottom: none; }
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 1.4rem;
    font-weight: 800;
    letter-spacing: -0.5px;
  }

  .brand i {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    width: 42px; height: 42px;
    border-radius: 14px;
    display: grid; place-items: center;
    color: white;
    font-size: 1.1rem;
    box-shadow: 0 8px 20px -6px var(--accent-2);
  }

  .brand span { color: var(--accent); }

  /* Featured movie poster */
  .featured {
    position: relative;
    border-radius: 18px;
    overflow: hidden;
    aspect-ratio: 16 / 10;
    background: var(--surface-2);
    box-shadow: 0 18px 34px -14px rgba(0,0,0,0.9);
    border: 1px solid rgba(255,255,255,0.06);
    cursor: pointer;
  }

  .featured img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.6s cubic-bezier(0.2, 0, 0, 1);
  }

  .featured:hover img { transform: scale(1.08); }

  .featured::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(11,16,32,0.98) 8%, rgba(11,16,32,0.35) 55%, transparent 100%);
    pointer-events: none;
  }

  .featured-info {
    position: absolute;
    left: 16px; right: 16px; bottom: 12px;
    z-index: 2;
  }

  .featured-info h3 {
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: -0.2px;
    margin-bottom: 3px;
  }

  .featured-info p {
    font-size: 0.75rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .featured-info .pill {
    background: rgba(255,77,109,0.2);
    color: #ffb3c1;
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 0.68rem;
    letter-spacing: 0.4px;
  }

  /* Play overlay on featured */
  .play-badge {
    position: absolute;
    top: 12px; right: 12px;
    z-index: 3;
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(255,77,109,0.95);
    color: white;
    display: grid; place-items: center;
    font-size: 0.95rem;
    box-shadow: 0 10px 24px -6px var(--accent-2), 0 0 0 4px rgba(255,77,109,0.15);
    transition: var(--transition);
    pointer-events: none;
    animation: pulseRing 2.4s infinite;
  }

  .featured:hover .play-badge {
    transform: scale(1.12);
    background: var(--accent);
  }

  @keyframes pulseRing {
    0%   { box-shadow: 0 10px 24px -6px var(--accent-2), 0 0 0 0 rgba(255,77,109,0.5); }
    70%  { box-shadow: 0 10px 24px -6px var(--accent-2), 0 0 0 14px rgba(255,77,109,0); }
    100% { box-shadow: 0 10px 24px -6px var(--accent-2), 0 0 0 0 rgba(255,77,109,0); }
  }

  /* Field */
  .field { display: flex; flex-direction: column; gap: 8px; }

  .field label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--muted);
    font-weight: 600;
  }

  /* Movie scroll */
  .movie-scroll {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 4px 2px 10px;
    scroll-snap-type: x mandatory;
    scrollbar-width: thin;
    scrollbar-color: var(--accent) var(--surface-2);
  }

  .movie-scroll::-webkit-scrollbar { height: 4px; }
  .movie-scroll::-webkit-scrollbar-track { background: var(--surface-2); border-radius: 10px; }
  .movie-scroll::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }

  .movie-card {
    flex: 0 0 auto;
    width: 92px;
    cursor: pointer;
    scroll-snap-align: start;
    transition: transform var(--transition);
    border: none;
    background: transparent;
    padding: 0;
    color: inherit;
    font-family: inherit;
  }

  .movie-card:hover { transform: translateY(-4px); }

  .movie-poster {
    width: 100%;
    aspect-ratio: 2 / 3;
    border-radius: 12px;
    overflow: hidden;
    background: var(--surface-2);
    border: 2px solid transparent;
    box-shadow: 0 8px 18px -8px rgba(0,0,0,0.9);
    transition: var(--transition);
    position: relative;
  }

  .movie-poster img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .movie-card.active .movie-poster {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(255,77,109,0.25), 0 12px 24px -8px var(--accent-2);
  }

  .movie-card.active .movie-poster::after {
    content: '\f00c';
    font-family: 'Font Awesome 6 Free';
    font-weight: 900;
    position: absolute;
    top: 6px; right: 6px;
    width: 20px; height: 20px;
    background: var(--accent);
    border-radius: 50%;
    display: grid; place-items: center;
    font-size: 0.6rem;
    color: white;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
  }

  .movie-name {
    margin-top: 6px;
    font-size: 0.72rem;
    font-weight: 600;
    text-align: center;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    transition: color var(--transition);
  }

  .movie-card.active .movie-name { color: var(--text); }

  /* Sidebar trailer button */
  .btn-trailer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 12px;
    border-radius: 12px;
    background: rgba(255,77,109,0.1);
    border: 1px solid rgba(255,77,109,0.35);
    color: #ffb3c1;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    transition: var(--transition);
    font-family: inherit;
  }

  .btn-trailer:hover {
    background: rgba(255,77,109,0.2);
    color: white;
    border-color: var(--accent);
    transform: translateY(-1px);
  }

  .btn-trailer i { font-size: 0.95rem; }

  /* Summary */
  .summary {
    margin-top: auto;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px;
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .summary-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    color: var(--muted);
    gap: 10px;
  }

  .summary-row strong {
    color: var(--text);
    font-weight: 600;
    text-align: right;
    max-width: 62%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .summary-row.total {
    padding-top: 12px;
    border-top: 1px dashed rgba(255,255,255,0.1);
    font-size: 1rem;
    color: var(--text);
  }

  .summary-row.total strong {
    color: var(--accent);
    font-size: 1.15rem;
  }

  .btn-book {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: white;
    border: none;
    padding: 14px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 0.98rem;
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    box-shadow: 0 12px 24px -10px var(--accent-2);
    font-family: inherit;
  }

  .btn-book:hover:not(:disabled) { transform: translateY(-2px); }
  .btn-book:active:not(:disabled) { transform: scale(0.98); }
  .btn-book:disabled {
    background: var(--surface-2);
    color: var(--muted);
    cursor: not-allowed;
    box-shadow: none;
  }

  /* ---------- SEAT AREA ---------- */
  .seat-area {
    padding: 32px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
  }

  .screen-wrap {
    width: 100%;
    max-width: 380px;
    perspective: 500px;
  }

  .screen {
    height: 10px;
    background: linear-gradient(to bottom, #ffffff, rgba(255,255,255,0.05));
    border-radius: 6px;
    transform: rotateX(-35deg);
    box-shadow: 0 18px 34px -6px rgba(255,77,109,0.45);
  }

  .screen-label {
    text-align: center;
    margin-top: 14px;
    font-size: 0.7rem;
    letter-spacing: 5px;
    color: var(--muted);
    font-weight: 600;
  }

  .seats {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .seat-row {
    display: flex;
    gap: 7px;
    align-items: center;
    justify-content: center;
  }

  .row-label {
    width: 18px;
    font-size: 0.72rem;
    color: var(--muted);
    font-weight: 700;
    text-align: center;
  }

  .seat {
    width: 26px;
    height: 24px;
    background: var(--surface-2);
    border: 1px solid rgba(255,255,255,0.08);
    border-top-left-radius: 7px;
    border-top-right-radius: 7px;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
  }

  .seat:not(.occupied):hover {
    transform: translateY(-3px) scale(1.1);
    border-color: var(--accent);
    box-shadow: 0 6px 14px -4px var(--accent);
  }

  .seat.selected {
    background: var(--selected);
    border-color: var(--selected);
    box-shadow: 0 0 14px rgba(34,197,94,0.6);
    animation: pop 0.28s ease;
  }

  @keyframes pop {
    0% { transform: scale(0.85); }
    60% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }

  .seat.occupied {
    background: var(--occupied);
    border-color: transparent;
    opacity: 0.45;
    cursor: not-allowed;
  }

  .seat.gap-right { margin-right: 14px; }

  .legend {
    display: flex;
    gap: 20px;
    list-style: none;
    flex-wrap: wrap;
    justify-content: center;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.78rem;
    color: var(--muted);
  }

  .legend-box {
    width: 16px;
    height: 15px;
    border-top-left-radius: 5px;
    border-top-right-radius: 5px;
  }

  /* ---------- TRAILER MODAL ---------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 8, 18, 0.9);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 200;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease, visibility 0.3s ease;
  }

  .modal-overlay.open {
    opacity: 1;
    visibility: visible;
  }

  .modal {
    width: 100%;
    max-width: 900px;
    background: var(--surface);
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 40px 80px -20px rgba(0,0,0,0.95);
    transform: scale(0.94) translateY(14px);
    opacity: 0;
    transition: transform 0.35s cubic-bezier(0.2, 0, 0, 1), opacity 0.35s ease;
  }

  .modal-overlay.open .modal {
    transform: scale(1) translateY(0);
    opacity: 1;
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    gap: 12px;
  }

  .modal-title {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .modal-title i {
    color: var(--accent);
    font-size: 1rem;
    flex-shrink: 0;
  }

  .modal-title h3 {
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: -0.2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .modal-close {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--text);
    display: grid; place-items: center;
    cursor: pointer;
    transition: var(--transition);
    flex-shrink: 0;
    font-size: 0.9rem;
  }

  .modal-close:hover {
    background: var(--accent);
    border-color: var(--accent);
    transform: rotate(90deg);
  }

  .video-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
  }

  .video-wrap iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }

  .modal-footer {
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    background: rgba(0,0,0,0.2);
  }

  .modal-meta {
    font-size: 0.82rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .modal-meta .price-tag {
    color: #ffb3c1;
    background: rgba(255,77,109,0.15);
    padding: 3px 10px;
    border-radius: 999px;
    font-weight: 600;
  }

  .modal-select-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: var(--transition);
    font-family: inherit;
  }

  .modal-select-btn:hover { transform: translateY(-1px); }

  /* Toast */
  .toast {
    position: fixed;
    left: 50%;
    bottom: -100px;
    transform: translateX(-50%);
    background: linear-gradient(135deg, var(--selected), #16a34a);
    color: #06210f;
    padding: 12px 26px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 0.9rem;
    box-shadow: 0 14px 30px -10px rgba(34,197,94,0.7);
    transition: bottom 0.35s cubic-bezier(0.2, 0, 0, 1);
    z-index: 300;
    display: flex;
    align-items: center;
    gap: 8px;
    max-width: calc(100vw - 40px);
  }

  .toast.show { bottom: 30px; }

  @media (max-width: 480px) {
    .seat { width: 22px; height: 21px; border-radius: 6px; }
    .seat-row { gap: 5px; }
    .seat.gap-right { margin-right: 10px; }
    .seat-area { padding: 22px 14px; }
    .sidebar { padding: 22px 16px; }
    .brand { font-size: 1.2rem; }
    .brand i { width: 36px; height: 36px; border-radius: 12px; }
    .movie-card { width: 78px; }
    .modal { border-radius: 14px; }
    .modal-header { padding: 12px 14px; }
    .modal-footer { padding: 12px 14px; }
  }
</style>
</head>
<body>

<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand">
      <i class="fas fa-film"></i>
      <div>MB<span>-App</span></div>
    </div>

    <!-- Featured poster -->
    <div class="featured" id="featuredCard" role="button" tabindex="0" aria-label="Watch trailer">
      <img id="featuredImg" src="" alt="Featured movie backdrop" />
      <div class="play-badge"><i class="fas fa-play"></i></div>
      <div class="featured-info">
        <h3 id="featuredTitle">Interstellar</h3>
        <p>
          <span class="pill" id="featuredPrice">$12</span>
          <span id="featuredGenre">Sci-Fi · 2h 49m</span>
        </p>
      </div>
    </div>

    <div class="field">
      <label>Now Showing</label>
      <div class="movie-scroll" id="movieScroll"></div>
    </div>

    <div class="field">
      <label for="time">Showtime</label>
      <select id="time" style="appearance:none;background:var(--surface-2);color:var(--text);border:1px solid rgba(255,255,255,0.08);padding:12px 14px;border-radius:10px;font-size:0.9rem;cursor:pointer;outline:none;">
        <option value="14:00">02:00 PM</option>
        <option value="17:30" selected>05:30 PM</option>
        <option value="20:00">08:00 PM</option>
        <option value="22:30">10:30 PM</option>
      </select>
    </div>

    <!-- Trailer button -->
    <button class="btn-trailer" id="trailerBtn">
      <i class="fas fa-play-circle"></i> Watch Trailer
    </button>

    <div class="summary">
      <div class="summary-row">
        <span>Movie</span>
        <strong id="sumMovie">Interstellar</strong>
      </div>
      <div class="summary-row">
        <span>Seats</span>
        <strong id="sumSeats">—</strong>
      </div>
      <div class="summary-row">
        <span>Count</span>
        <strong id="sumCount">0</strong>
      </div>
      <div class="summary-row total">
        <span>Total</span>
        <strong>$<span id="sumTotal">0</span></strong>
      </div>
    </div>

    <button class="btn-book" id="bookBtn" disabled>
      <i class="fas fa-ticket-alt"></i> Confirm Booking
    </button>
  </aside>

  <!-- SEAT AREA -->
  <section class="seat-area">
    <div class="screen-wrap">
      <div class="screen"></div>
      <div class="screen-label">SCREEN</div>
    </div>

    <div class="seats" id="seats"></div>

    <ul class="legend">
      <li class="legend-item"><div class="legend-box" style="background:var(--surface-2);border:1px solid rgba(255,255,255,0.15)"></div>Available</li>
      <li class="legend-item"><div class="legend-box" style="background:var(--selected)"></div>Selected</li>
      <li class="legend-item"><div class="legend-box" style="background:var(--occupied);opacity:.5"></div>Occupied</li>
    </ul>
  </section>
</div>

<!-- TRAILER MODAL -->
<div class="modal-overlay" id="trailerModal" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <div class="modal-title">
        <i class="fas fa-clapperboard"></i>
        <h3 id="modalTitle">Trailer</h3>
      </div>
      <button class="modal-close" id="modalClose" aria-label="Close trailer">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <div class="video-wrap" id="videoWrap">
      <!-- iframe injected here -->
    </div>
    <div class="modal-footer">
      <div class="modal-meta">
        <span id="modalGenre">Sci-Fi · 2h 49m</span>
        <span class="price-tag" id="modalPrice">$12</span>
      </div>
      <button class="modal-select-btn" id="modalSelectBtn">
        <i class="fas fa-chair"></i> Select Seats for this Movie
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><i class="fas fa-check-circle"></i> <span id="toastText">Booking Confirmed!</span></div>

<script>
(() => {
  // ---------- MOVIE DATA (poster + backdrop + YouTube trailer) ----------
  const MOVIES = [
    {
      id: 'interstellar',
      title: 'Interstellar',
      price: 12,
      genre: 'Sci-Fi · 2h 49m',
      poster: 'https://image.tmdb.org/t/p/w300/9d0oZ5bYwEeYbBnzYgLTsQwZzGb.jpg',
      backdrop: 'https://image.tmdb.org/t/p/w780/xu9zaAevzQ5nnrsXN6JcahLnG4i.jpg',
      trailer: 'zSWdZVtXT7E'   // YouTube video ID
    },
    {
      id: 'dune',
      title: 'Dune: Part Two',
      price: 15,
      genre: 'Sci-Fi · 2h 46m',
      poster: 'https://image.tmdb.org/t/p/w300/1pdfLvkbY9ohJlCjQH2CZjjYVvJ.jpg',
      backdrop: 'https://image.tmdb.org/t/p/w780/xOMo8BRK7PfcJv9JCnx7s5hj0PX.jpg',
      trailer: 'Way9Dexny3w'
    },
    {
      id: 'oppenheimer',
      title: 'Oppenheimer',
      price: 10,
      genre: 'Biography · 3h 0m',
      poster: 'https://image.tmdb.org/t/p/w300/8Gxv8gSFCU0XGDykEGv7zR1n2ua.jpg',
      backdrop: 'https://image.tmdb.org/t/p/w780/nb3xI8XI3w4pMVZ38VijbsyBqP4.jpg',
      trailer: 'uYPbbksJxIg'
    },
    {
      id: 'spiderman',
      title: 'Spider-Man: No Way Home',
      price: 14,
      genre: 'Action · 2h 28m',
      poster: 'https://image.tmdb.org/t/p/w300/1g0dhYtq4irTY1GPXvft6k4YLjm.jpg',
      backdrop: 'https://image.tmdb.org/t/p/w780/iQFcwSGbZXMkeyKrxbPnwnRo5fl.jpg',
      trailer: 'JfVOs4VSpmA'
    },
    {
      id: 'barbie',
      title: 'Barbie',
      price: 13,
      genre: 'Comedy · 1h 54m',
      poster: 'https://image.tmdb.org/t/p/w300/iuFNMS8U5cb6xfzi51Dbkovj7vM.jpg',
      backdrop: 'https://image.tmdb.org/t/p/w780/nHf61UzkfFno5X1ofIhugCPus2R.jpg',
      trailer: 'pBk4NYhWNMM'
    },
    {
      id: 'dark_knight',
      title: 'The Dark Knight',
      price: 11,
      genre: 'Action · 2h 32m',
      poster: 'https://image.tmdb.org/t/p/w300/qJ2tW6WMUDux911r6m7haRef0WH.jpg',
      backdrop: 'https://image.tmdb.org/t/p/w780/hkBaDkMWbLaf8B1lsWsKX7Ew3Xq.jpg',
      trailer: 'EXeTwQWrcwY'
    }
  ];

  // ---------- SEAT CONFIG ----------
  const ROWS = 6;
  const COLS = 10;
  const AISLE_AFTER = [3, 7];
  const OCCUPIED = new Set(['A2','A3','B5','C6','C7','D1','E4','E5','F9']);

  // ---------- STATE ----------
  let currentMovie = MOVIES[0];
  const selected = new Set();
  let lastFocusedEl = null;

  // ---------- DOM ----------
  const seatsEl        = document.getElementById('seats');
  const movieScrollEl  = document.getElementById('movieScroll');
  const featuredCard   = document.getElementById('featuredCard');
  const featuredImg    = document.getElementById('featuredImg');
  const featuredTitle  = document.getElementById('featuredTitle');
  const featuredPrice  = document.getElementById('featuredPrice');
  const featuredGenre  = document.getElementById('featuredGenre');
  const sumMovieEl     = document.getElementById('sumMovie');
  const sumSeatsEl     = document.getElementById('sumSeats');
  const sumCountEl     = document.getElementById('sumCount');
  const sumTotalEl     = document.getElementById('sumTotal');
  const bookBtn        = document.getElementById('bookBtn');
  const trailerBtn     = document.getElementById('trailerBtn');
  const toast          = document.getElementById('toast');
  const toastText      = document.getElementById('toastText');

  // Modal
  const modalOverlay   = document.getElementById('trailerModal');
  const modalClose     = document.getElementById('modalClose');
  const modalTitle     = document.getElementById('modalTitle');
  const modalGenre     = document.getElementById('modalGenre');
  const modalPrice     = document.getElementById('modalPrice');
  const videoWrap      = document.getElementById('videoWrap');
  const modalSelectBtn = document.getElementById('modalSelectBtn');

  // ---------- RENDER MOVIE CARDS ----------
  function buildMovieCards() {
    movieScrollEl.innerHTML = '';
    MOVIES.forEach(movie => {
      const card = document.createElement('button');
      card.className = 'movie-card' + (movie.id === currentMovie.id ? ' active' : '');
      card.dataset.id = movie.id;
      card.type = 'button';
      card.setAttribute('aria-label', `Select ${movie.title}`);

      card.innerHTML = `
        <div class="movie-poster">
          <img src="${movie.poster}" alt="${movie.title} poster" loading="lazy"
               onerror="this.style.display='none';this.parentElement.style.background='linear-gradient(145deg,#2a3145,#1c2338)';" />
        </div>
        <div class="movie-name">${movie.title.split(':')[0]}</div>
      `;

      card.addEventListener('click', () => selectMovie(movie.id));
      movieScrollEl.appendChild(card);
    });
  }

  // ---------- SELECT MOVIE ----------
  function selectMovie(id) {
    const movie = MOVIES.find(m => m.id === id);
    if (!movie) return;

    currentMovie = movie;

    document.querySelectorAll('.movie-card').forEach(c => {
      c.classList.toggle('active', c.dataset.id === id);
    });

    // Fade featured backdrop
    featuredImg.style.transition = 'opacity 0.3s ease';
    featuredImg.style.opacity = 0;
    setTimeout(() => {
      featuredImg.src = movie.backdrop;
      featuredImg.alt = `${movie.title} backdrop`;
      featuredImg.style.opacity = 1;
    }, 120);

    featuredTitle.textContent = movie.title;
    featuredPrice.textContent = `$${movie.price}`;
    featuredGenre.textContent = movie.genre;

    selected.clear();
    updateUI();
  }

  // ---------- BUILD SEATS ----------
  function buildSeats() {
    seatsEl.innerHTML = '';
    for (let r = 0; r < ROWS; r++) {
      const rowLetter = String.fromCharCode(65 + r);
      const rowDiv = document.createElement('div');
      rowDiv.className = 'seat-row';

      const label = document.createElement('span');
      label.className = 'row-label';
      label.textContent = rowLetter;
      rowDiv.appendChild(label);

      for (let c = 1; c <= COLS; c++) {
        const seatId = `${rowLetter}${c}`;
        const seat = document.createElement('div');
        seat.className = 'seat';
        seat.dataset.id = seatId;
        seat.setAttribute('role', 'button');
        seat.setAttribute('aria-label', `Seat ${seatId}`);

        if (OCCUPIED.has(seatId)) seat.classList.add('occupied');
        if (AISLE_AFTER.includes(c)) seat.classList.add('gap-right');

        rowDiv.appendChild(seat);
      }
      seatsEl.appendChild(rowDiv);
    }
  }

  // ---------- UPDATE UI ----------
  function updateUI() {
    const ids = [...selected].sort();
    const count = ids.length;
    const total = count * currentMovie.price;

    sumMovieEl.textContent = currentMovie.title;
    sumSeatsEl.textContent = count ? ids.join(', ') : '—';
    sumCountEl.textContent = count;
    sumTotalEl.textContent = total;
    bookBtn.disabled = count === 0;

    document.querySelectorAll('.seat').forEach(s => {
      s.classList.toggle('selected', selected.has(s.dataset.id) && !s.classList.contains('occupied'));
    });
  }

  // ---------- SEAT CLICK ----------
  seatsEl.addEventListener('click', (e) => {
    const seat = e.target.closest('.seat');
    if (!seat || seat.classList.contains('occupied')) return;

    const id = seat.dataset.id;
    if (selected.has(id)) selected.delete(id);
    else selected.add(id);
    updateUI();
  });

  // ---------- BOOK ----------
  bookBtn.addEventListener('click', () => {
    if (selected.size === 0) return;

    const bookedIds = [...selected].sort();
    const totalPaid = (bookedIds.length * currentMovie.price).toFixed(2);

    bookedIds.forEach(id => {
      OCCUPIED.add(id);
      const seatEl = document.querySelector(`.seat[data-id="${id}"]`);
      if (seatEl) {
        seatEl.classList.remove('selected');
        seatEl.classList.add('occupied');
      }
    });

    selected.clear();
    updateUI();

    showToast(`${bookedIds.length} seat(s) booked · $${totalPaid} 🍿`);
  });

  // ---------- TRAILER MODAL ----------
  function openTrailer() {
    const movie = currentMovie;
    lastFocusedEl = document.activeElement;

    modalTitle.textContent = `${movie.title} — Official Trailer`;
    modalGenre.textContent = movie.genre;
    modalPrice.textContent = `$${movie.price}`;

    // Inject YouTube iframe (with autoplay + modest branding)
    videoWrap.innerHTML = `
      <iframe
        src="https://www.youtube.com/embed/${movie.trailer}?autoplay=1&rel=0&modestbranding=1"
        title="${movie.title} trailer"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen
      ></iframe>
    `;

    modalOverlay.classList.add('open');
    modalOverlay.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    setTimeout(() => modalClose.focus(), 120);
  }

  function closeTrailer() {
    modalOverlay.classList.remove('open');
    modalOverlay.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    // Delay iframe removal so fade-out is smooth & audio stops
    setTimeout(() => { videoWrap.innerHTML = ''; }, 320);
    if (lastFocusedEl) lastFocusedEl.focus();
  }

  trailerBtn.addEventListener('click', openTrailer);
  featuredCard.addEventListener('click', openTrailer);
  featuredCard.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      openTrailer();
    }
  });

  modalClose.addEventListener('click', closeTrailer);
  modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay) closeTrailer();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modalOverlay.classList.contains('open')) closeTrailer();
  });

  // Modal "select seats for this movie" — just closes and highlights
  modalSelectBtn.addEventListener('click', () => {
    closeTrailer();
    setTimeout(() => {
      // Scroll to seat area on mobile
      document.querySelector('.seat-area').scrollIntoView({ behavior: 'smooth', block: 'center' });
      showToast(`Now selecting seats for ${currentMovie.title}`, false);
    }, 300);
  });

  // ---------- TOAST ----------
  let toastTimer;
  function showToast(msg, isSuccess = true) {
    toastText.textContent = msg;
    toast.style.background = isSuccess
      ? 'linear-gradient(135deg, #22c55e, #16a34a)'
      : 'linear-gradient(135deg, #ff4d6d, #c9184a)';
    toast.style.color = isSuccess ? '#06210f' : '#fff';
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 3200);
  }

  // ---------- INIT ----------
  buildMovieCards();
  buildSeats();
  featuredImg.src = currentMovie.backdrop;
  featuredImg.alt = currentMovie.title;
  updateUI();

  // Preload backdrops
  MOVIES.forEach(m => { const img = new Image(); img.src = m.backdrop; });
})();
</script>
</body>
</html>
