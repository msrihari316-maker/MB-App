<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MB-App · Movie Booking</title>
    <!-- Google Fonts & Font Awesome for icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #0b0f1a 0%, #1a1f2e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        /* main app container – fluid glass card */
        .app-container {
            max-width: 1300px;
            width: 100%;
            background: rgba(18, 25, 40, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 3rem;
            padding: 1.8rem 2.2rem;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.7), inset 0 1px 2px rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        /* header */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            background: linear-gradient(135deg, #ff4d6d, #c9184a);
            width: 2.8rem;
            height: 2.8rem;
            border-radius: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: white;
            box-shadow: 0 10px 20px -8px #c9184a;
        }

        .logo-text {
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #fff, #b3c7ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .logo-text span {
            background: linear-gradient(135deg, #ff4d6d, #ffb3c1);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 800;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
            color: #ccd6f0;
        }

        .header-actions i {
            font-size: 1.4rem;
            opacity: 0.8;
            transition: all 0.2s;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.03);
            padding: 0.7rem;
            border-radius: 50%;
            width: 2.8rem;
            height: 2.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .header-actions i:hover {
            opacity: 1;
            background: rgba(255, 77, 109, 0.2);
            color: #ff4d6d;
            transform: scale(1.05);
        }

        /* movie selection row */
        .movie-picker {
            display: flex;
            gap: 1rem;
            overflow-x: auto;
            padding: 0.5rem 0.2rem 1.2rem 0.2rem;
            scrollbar-width: thin;
            scrollbar-color: #ff4d6d #1e2538;
            margin-bottom: 0.8rem;
        }

        .movie-picker::-webkit-scrollbar {
            height: 5px;
        }

        .movie-picker::-webkit-scrollbar-track {
            background: #1e2538;
            border-radius: 10px;
        }

        .movie-picker::-webkit-scrollbar-thumb {
            background: #ff4d6d;
            border-radius: 10px;
        }

        .movie-card {
            flex: 0 0 auto;
            width: 160px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 1.8rem;
            padding: 1rem 0.8rem 0.8rem 0.8rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.2, 0, 0, 1);
            border: 1.5px solid rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(4px);
        }

        .movie-card.active {
            background: rgba(255, 77, 109, 0.12);
            border-color: #ff4d6d;
            box-shadow: 0 8px 20px -8px #ff4d6d;
            transform: translateY(-4px);
        }

        .movie-card:hover {
            transform: translateY(-6px);
            background: rgba(255, 255, 255, 0.06);
        }

        .movie-poster {
            width: 100%;
            aspect-ratio: 2 / 3;
            border-radius: 1.3rem;
            background: linear-gradient(145deg, #2a3145, #1b212f);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: #7385a8;
            margin-bottom: 0.8rem;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .movie-card[data-movie="dune"] .movie-poster { background: linear-gradient(145deg, #c2955e, #5e3e1c); color: #f7e3c0; }
        .movie-card[data-movie="oppenheimer"] .movie-poster { background: linear-gradient(145deg, #1e1e1e, #4a3a2a); color: #d4af37; }
        .movie-card[data-movie="barbie"] .movie-poster { background: linear-gradient(145deg, #ff8fab, #c44569); color: #ffe0e9; }
        .movie-card[data-movie="interstellar"] .movie-poster { background: linear-gradient(145deg, #1c3b5c, #0a1a2a); color: #7ab7ff; }
        .movie-card[data-movie="godfather"] .movie-poster { background: linear-gradient(145deg, #2d1f1f, #0f0b0b); color: #c0a86a; }

        .movie-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: white;
            text-align: center;
            line-height: 1.2;
            margin-bottom: 0.2rem;
        }

        .movie-sub {
            font-size: 0.7rem;
            color: #9aa9c9;
            letter-spacing: 0.3px;
        }

        /* showtime & screen info */
        .showtime-section {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin: 1rem 0 1.4rem 0;
            padding: 0.5rem 0.2rem;
            gap: 1rem;
        }

        .date-badge {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background: rgba(255, 255, 255, 0.03);
            padding: 0.6rem 1.2rem;
            border-radius: 3rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #cdd9f0;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .date-badge i {
            color: #ff4d6d;
        }

        .screen-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #cdd9f0;
            font-size: 0.95rem;
            background: rgba(255, 255, 255, 0.03);
            padding: 0.6rem 1.2rem;
            border-radius: 3rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .screen-indicator i {
            color: #ffb347;
        }

        /* seating layout */
        .seat-map-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 1.5rem 0 1rem 0;
        }

        .screen-curve {
            width: 85%;
            max-width: 600px;
            height: 38px;
            background: radial-gradient(ellipse at top, #ff4d6d30, transparent 70%);
            border-top: 3px solid #ff4d6d;
            border-radius: 50% / 100% 100% 0 0;
            margin-bottom: 2rem;
            position: relative;
            filter: drop-shadow(0 -6px 12px #ff4d6d40);
        }

        .screen-curve::after {
            content: "SCREEN";
            position: absolute;
            top: -28px;
            left: 50%;
            transform: translateX(-50%);
            color: #a5b3d4;
            font-size: 0.75rem;
            letter-spacing: 6px;
            font-weight: 600;
            text-shadow: 0 0 12px #ff4d6d;
        }

        .seats-grid {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.7rem;
            width: 100%;
            padding: 0.5rem 0;
        }

        .seat-row {
            display: flex;
            justify-content: center;
            gap: 0.7rem;
            flex-wrap: wrap;
        }

        .seat {
            width: 2.4rem;
            height: 2.4rem;
            border-radius: 0.9rem;
            background: #2a3145;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 600;
            color: #a8b8db;
            cursor: pointer;
            transition: all 0.15s ease;
            border: 1.5px solid transparent;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.4);
            user-select: none;
        }

        .seat:not(.occupied):hover {
            background: #3e4a66;
            transform: scale(1.08);
            border-color: #ffb3c1;
        }

        .seat.selected {
            background: linear-gradient(145deg, #ff4d6d, #c9184a);
            color: white;
            border-color: #ffb3c1;
            box-shadow: 0 0 16px #ff4d6d, 0 4px 8px black;
            transform: scale(1.02);
        }

        .seat.occupied {
            background: #151b28;
            color: #3c455e;
            cursor: not-allowed;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.8);
            border-color: #212a3e;
        }

        /* Legend */
        .legend {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 2rem;
            margin: 1.5rem 0 1rem 0;
            color: #b6c4e0;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .legend-box {
            width: 1.2rem;
            height: 1.2rem;
            border-radius: 0.4rem;
            background: #2a3145;
        }

        .legend-box.selected {
            background: linear-gradient(145deg, #ff4d6d, #c9184a);
            box-shadow: 0 0 10px #ff4d6d;
        }

        .legend-box.occupied {
            background: #151b28;
            border: 1px solid #2f3a52;
        }

        /* booking summary and actions */
        .booking-footer {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-top: 1.8rem;
            padding-top: 1.2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            gap: 1rem;
        }

        .summary {
            display: flex;
            align-items: center;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .summary-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            color: #d0dcf5;
            font-size: 1rem;
            background: rgba(0, 0, 0, 0.2);
            padding: 0.6rem 1.4rem;
            border-radius: 3rem;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .summary-item i {
            color: #ff4d6d;
            font-size: 1.1rem;
        }

        .summary-item span {
            font-weight: 600;
            color: white;
            margin-left: 0.2rem;
        }

        .book-btn {
            background: linear-gradient(145deg, #ff4d6d, #c9184a);
            border: none;
            color: white;
            padding: 1rem 2.8rem;
            border-radius: 3rem;
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 12px 24px -8px #c9184a;
            letter-spacing: 0.3px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            will-change: transform;
        }

        .book-btn:hover {
            transform: scale(1.02);
            background: linear-gradient(145deg, #ff5e7a, #d61e4e);
            box-shadow: 0 18px 30px -10px #ff4d6d;
        }

        .book-btn:active {
            transform: scale(0.98);
        }

        .book-btn:disabled {
            opacity: 0.5;
            transform: none;
            box-shadow: none;
            cursor: not-allowed;
            background: #3a3f52;
        }

        /* fluid transitions */
        .fade-message {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(20, 28, 45, 0.95);
            backdrop-filter: blur(12px);
            color: white;
            padding: 1rem 2rem;
            border-radius: 3rem;
            border-left: 6px solid #ff4d6d;
            box-shadow: 0 20px 40px black;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.25s, transform 0.25s;
            pointer-events: none;
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            letter-spacing: 0.2px;
        }

        .fade-message.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* responsive tweaks */
        @media (max-width: 700px) {
            .app-container {
                padding: 1.2rem 1.2rem;
                border-radius: 2rem;
            }

            .seat {
                width: 2rem;
                height: 2rem;
                font-size: 0.6rem;
                border-radius: 0.7rem;
            }

            .seat-row {
                gap: 0.45rem;
            }

            .movie-card {
                width: 130px;
            }

            .logo-text {
                font-size: 1.5rem;
            }

            .book-btn {
                padding: 0.8rem 1.8rem;
                font-size: 1rem;
            }

            .summary {
                gap: 1rem;
            }
        }

        @media (max-width: 480px) {
            .seat {
                width: 1.7rem;
                height: 1.7rem;
                font-size: 0.55rem;
                border-radius: 0.6rem;
            }

            .seat-row {
                gap: 0.3rem;
            }

            .screen-curve::after {
                font-size: 0.6rem;
                letter-spacing: 3px;
            }

            .movie-card {
                width: 110px;
            }

            .movie-title {
                font-size: 0.75rem;
            }
        }

        /* scroll on small heights */
        .app-container {
            max-height: 98vh;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #ff4d6d #1e2538;
        }

        .app-container::-webkit-scrollbar {
            width: 6px;
        }

        .app-container::-webkit-scrollbar-track {
            background: #1e2538;
            border-radius: 10px;
        }

        .app-container::-webkit-scrollbar-thumb {
            background: #ff4d6d;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <div class="app-header">
            <div class="logo-area">
                <div class="logo-icon"><i class="fas fa-film"></i></div>
                <div class="logo-text">MB<span>-App</span></div>
            </div>
            <div class="header-actions">
                <i class="fas fa-search"></i>
                <i class="fas fa-user-circle"></i>
            </div>
        </div>

        <!-- Movie picker -->
        <div class="movie-picker" id="moviePicker">
            <div class="movie-card active" data-movie="dune" data-price="14">
                <div class="movie-poster"><i class="fas fa-sun"></i></div>
                <div class="movie-title">Dune: Part Two</div>
                <div class="movie-sub">Sci-Fi · 2h 46m</div>
            </div>
            <div class="movie-card" data-movie="oppenheimer" data-price="15">
                <div class="movie-poster"><i class="fas fa-atom"></i></div>
                <div class="movie-title">Oppenheimer</div>
                <div class="movie-sub">Biography · 3h</div>
            </div>
            <div class="movie-card" data-movie="barbie" data-price="12">
                <div class="movie-poster"><i class="fas fa-star"></i></div>
                <div class="movie-title">Barbie</div>
                <div class="movie-sub">Comedy · 1h 54m</div>
            </div>
            <div class="movie-card" data-movie="interstellar" data-price="13">
                <div class="movie-poster"><i class="fas fa-rocket"></i></div>
                <div class="movie-title">Interstellar</div>
                <div class="movie-sub">Sci-Fi · 2h 49m</div>
            </div>
            <div class="movie-card" data-movie="godfather" data-price="11">
                <div class="movie-poster"><i class="fas fa-crown"></i></div>
                <div class="movie-title">The Godfather</div>
                <div class="movie-sub">Crime · 2h 55m</div>
            </div>
        </div>

        <!-- Showtime / screen -->
        <div class="showtime-section">
            <div class="date-badge"><i class="fas fa-calendar-alt"></i> Today, 24 May · 7:30 PM</div>
            <div class="screen-indicator"><i class="fas fa-tv"></i> IMAX · Screen 4</div>
        </div>

        <!-- Seat map -->
        <div class="seat-map-container">
            <div class="screen-curve"></div>
            <div class="seats-grid" id="seatsGrid">
                <!-- dynamically generated by JS -->
            </div>
        </div>

        <!-- Legend -->
        <div class="legend">
            <div class="legend-item"><div class="legend-box"></div> Available</div>
            <div class="legend-item"><div class="legend-box selected"></div> Selected</div>
            <div class="legend-item"><div class="legend-box occupied"></div> Occupied</div>
        </div>

        <!-- Booking summary -->
        <div class="booking-footer">
            <div class="summary">
                <div class="summary-item"><i class="fas fa-chair"></i> Seats: <span id="selectedCount">0</span></div>
                <div class="summary-item"><i class="fas fa-tag"></i> Total: $<span id="totalPrice">0</span></div>
            </div>
            <button class="book-btn" id="bookBtn" disabled><i class="fas fa-ticket-alt"></i> Book now</button>
        </div>
    </div>

    <!-- toast message -->
    <div class="fade-message" id="toastMessage"><i class="fas fa-check-circle"></i> <span id="toastText">Booking confirmed!</span></div>

    <script>
        (function() {
            // ---------- CONFIG ----------
            const rows = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
            const seatsPerRow = 10;
            const occupiedSeats = [
                'A3','A4','A9','B1','B2','B8','C5','C6','C7','D4','D10',
                'E2','E3','E9','F6','F7','F8','G1','G10','H5','H6'
            ]; // realistic occupied seats

            // State
            let selectedSeats = new Set();
            let currentMoviePrice = 14; // default for Dune
            let currentMovieId = 'dune';

            // DOM elements
            const seatsGrid = document.getElementById('seatsGrid');
            const selectedCountSpan = document.getElementById('selectedCount');
            const totalPriceSpan = document.getElementById('totalPrice');
            const bookBtn = document.getElementById('bookBtn');
            const movieCards = document.querySelectorAll('.movie-card');
            const toastMessage = document.getElementById('toastMessage');
            const toastText = document.getElementById('toastText');

            // ---------- INIT SEAT MAP ----------
            function renderSeats() {
                seatsGrid.innerHTML = '';
                rows.forEach(row => {
                    const rowDiv = document.createElement('div');
                    rowDiv.className = 'seat-row';
                    for (let i = 1; i <= seatsPerRow; i++) {
                        const seatId = row + i;
                        const seat = document.createElement('div');
                        seat.className = 'seat';
                        seat.dataset.seatId = seatId;
                        seat.textContent = seatId;

                        if (occupiedSeats.includes(seatId)) {
                            seat.classList.add('occupied');
                        } else {
                            seat.addEventListener('click', (e) => toggleSeat(e, seatId));
                        }
                        rowDiv.appendChild(seat);
                    }
                    seatsGrid.appendChild(rowDiv);
                });
                // reapply selections if any (e.g., after movie change, we might keep selection? but we reset)
                // we keep selection on movie change? The design: if change movie, selection stays but price changes.
                // But we also need to re-mark selected seats visually.
                updateSelectedSeatsVisual();
            }

            // helper to update visual selection classes after render or toggle
            function updateSelectedSeatsVisual() {
                document.querySelectorAll('.seat').forEach(seat => {
                    const seatId = seat.dataset.seatId;
                    if (selectedSeats.has(seatId) && !seat.classList.contains('occupied')) {
                        seat.classList.add('selected');
                    } else {
                        seat.classList.remove('selected');
                    }
                });
            }

            // toggle seat selection
            function toggleSeat(event, seatId) {
                const seatEl = event.currentTarget;
                if (seatEl.classList.contains('occupied')) return;

                if (selectedSeats.has(seatId)) {
                    selectedSeats.delete(seatId);
                    seatEl.classList.remove('selected');
                } else {
                    selectedSeats.add(seatId);
                    seatEl.classList.add('selected');
                }
                updateSummaryAndButton();
            }

            // update UI summary (count, price, button state)
            function updateSummaryAndButton() {
                const count = selectedSeats.size;
                selectedCountSpan.textContent = count;
                const total = (count * currentMoviePrice).toFixed(2);
                totalPriceSpan.textContent = total;

                if (count > 0) {
                    bookBtn.disabled = false;
                } else {
                    bookBtn.disabled = true;
                }
            }

            // show toast message
            function showToast(message, isSuccess = true) {
                toastText.textContent = message;
                toastMessage.style.borderLeftColor = isSuccess ? '#4cd964' : '#ff4d6d';
                toastMessage.querySelector('i').className = isSuccess ? 'fas fa-check-circle' : 'fas fa-exclamation-circle';
                toastMessage.classList.add('show');
                setTimeout(() => {
                    toastMessage.classList.remove('show');
                }, 2600);
            }

            // reset selection (on movie change we keep seats? Better reset for clarity? I'll keep selection but recalc price. Also re-render to reflect any changes? But occupancy same. We'll keep selected seats)
            // But if we keep, we need to visually reapply selected class. Already in updateSelectedSeatsVisual.
            function applyMoviePrice(movieId, price) {
                currentMovieId = movieId;
                currentMoviePrice = parseFloat(price);
                updateSummaryAndButton();
            }

            // ---------- MOVIE SELECTION ----------
            movieCards.forEach(card => {
                card.addEventListener('click', () => {
                    // update active class
                    movieCards.forEach(c => c.classList.remove('active'));
                    card.classList.add('active');

                    const movieId = card.dataset.movie;
                    const price = card.dataset.price || 14; // fallback
                    applyMoviePrice(movieId, price);
                    // also can show small toast about movie change? optional
                    // showToast(`Now browsing: ${card.querySelector('.movie-title').textContent}`, true);
                });
            });

            // ---------- BOOK BUTTON ----------
            bookBtn.addEventListener('click', () => {
                if (selectedSeats.size === 0) return;
                const seatList = Array.from(selectedSeats).sort().join(', ');
                const total = (selectedSeats.size * currentMoviePrice).toFixed(2);
                // Simulate booking success
                showToast(`🎉 Booked ${selectedSeats.size} seat(s) (${seatList}) for $${total}`, true);
                // Clear selection after booking
                selectedSeats.clear();
                updateSelectedSeatsVisual();
                updateSummaryAndButton();
            });

            // ---------- INITIAL SETUP ----------
            renderSeats();
